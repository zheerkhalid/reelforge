[package]
name = "reelforge"
version = "1.0.0"
edition = "2021"
description = "Fast, easy video and audio converter with GPU acceleration"
authors = ["Zheer Khalid (https://zheer.dev)"]
homepage = "https://zheer.dev"
repository = "https://github.com/zheerkhalid/reelforge"
license = "MIT"

[[bin]]
name = "ReelForge"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"

[build-dependencies]
tiny-skia = "0.11"
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
